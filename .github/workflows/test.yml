name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} / Dart ${{ matrix.dart }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            dart: stable
          - os: macos-latest
            dart: stable
          - os: windows-latest
            dart: stable
          - os: ubuntu-latest
            dart: '3.5'

    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.dart }}
      - run: dart pub get
      - if: matrix.os == 'ubuntu-latest' && matrix.dart == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - if: matrix.os == 'ubuntu-latest' && matrix.dart == 'stable'
        run: dart analyze --fatal-infos --fatal-warnings .
      - run: dart test
